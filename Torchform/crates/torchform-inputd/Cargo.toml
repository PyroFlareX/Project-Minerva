[package]
name    = "torchform-inputd"
version = "0.1.0"
edition = "2021"
description = "Torchform input daemon — Cirque axis synthesis, chord detection, uinput virtual gamepad"

[[bin]]
name = "torchform-inputd"
path = "src/main.rs"

[dependencies]
# uinput virtual device
uinput             = { workspace = true }

# SPI for Cirque GlidePoint trackpad
spidev             = { workspace = true }

# udev for device enumeration
udev               = { workspace = true }

# Async
tokio              = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
serde              = { workspace = true }
toml               = { workspace = true }
