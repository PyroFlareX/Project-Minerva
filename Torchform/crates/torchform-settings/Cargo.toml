[package]
name        = "torchform-settings"
version     = "0.1.0"
edition     = "2021"
description = "Torchform Settings — standalone settings editor app"

[[bin]]
name = "torchform-settings"
path = "src/main.rs"

[build-dependencies]
slint-build = { workspace = true }

[dependencies]
torchform-config  = { path = "../torchform-config" }
torchform-actions = { path = "../torchform-actions" }
slint              = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
serde              = { workspace = true }
toml               = { workspace = true }
