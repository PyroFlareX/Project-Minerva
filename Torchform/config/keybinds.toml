# =============================================================================
# Torchform keybinds — input to action mapping
#
# This file maps named raw inputs to named ShellActions.
# Copy to ~/.config/torchform/keybinds.toml to override for your user.
#
# Raw input names:
#   button_a, button_b, button_x, button_y
#   button_select, button_start
#   l1, r1                       (shoulder bumpers — digital)
#   l2_hold_true, l2_hold_false  (trigger held / released)
#   r2_hold_true, r2_hold_false
#   dpad_up, dpad_down, dpad_left, dpad_right
#   select_long                  (held Select for ~1 s)
#   l2_r2_brightness_up, l2_r2_brightness_down
#   l2_r2_volume_up, l2_r2_volume_down
#   l2_r2_wifi, l2_r2_bt
#
# Emulator keyboard → controller mapping (desktop testing only):
#
#   Key            Controller input       Default action
#   ─────────────────────────────────────────────────────
#   A              button_a               confirm
#   B              button_b               cancel
#   X              button_x               open_palette
#   Space          button_select          go_home
#   Enter          button_start           open_switcher
#   Tab (hold)     l2_hold_true           radial_hold_true
#   Tab (release)  l2_hold_false          radial_hold_false
#   Esc            button_b               cancel
#   Z              r1                     open_quick_settings
#   C              l1                     open_notifications
#   Arrow Up       dpad_up                nav_up
#   Arrow Down     dpad_down              nav_down
#   Arrow Left     dpad_left              nav_left
#   Arrow Right    dpad_right             nav_right
#   I              stick north            (analog, bypasses keybinds)
#   K              stick south            (analog, bypasses keybinds)
#   J              stick west             (analog, bypasses keybinds)
#   L              stick east             (analog, bypasses keybinds)
#
#   The keyboard mapping is hardcoded in ui/emulator.slint and ui/shell.slint
#   (FocusScope key-pressed/key-released handlers). It cannot be changed here.
#
# Action names:
#   confirm, cancel
#   open_palette, open_switcher
#   open_quick_settings           — slide in Quick Settings panel (right)
#   open_notifications            — slide in Notifications panel (left)
#   go_home                       — return to Home screen
#   lock                          — go to Lock screen (long-press or chord)
#   radial_hold_true, radial_hold_false
#   nav_up, nav_down, nav_left, nav_right
#   workspace_prev, workspace_next
#   brightness_up, brightness_down
#   volume_up, volume_down
#   wifi_toggle, bluetooth_toggle, cellular_toggle, vpn_toggle
#   split_toggle, sleep
#   lower_backspace, lower_submit
#
# To disable a binding: remove the line (or comment it out with #).
# To swap two actions: exchange their values.
# Unknown action names are silently ignored with a log warning.
# =============================================================================

[binds]

# --- Face buttons -----------------------------------------------------------
button_a      = "confirm"
button_b      = "cancel"
button_select = "go_home"
button_start  = "open_switcher"
button_x      = "open_palette"

# --- Shoulder triggers — radial menu ----------------------------------------
# L2/R2 hold = radial quick-action ring.
l2_hold_true  = "radial_hold_true"
l2_hold_false = "radial_hold_false"
r2_hold_true  = "radial_hold_true"
r2_hold_false = "radial_hold_false"

# --- D-pad ------------------------------------------------------------------
dpad_up    = "nav_up"
dpad_down  = "nav_down"
dpad_left  = "nav_left"
dpad_right = "nav_right"

# --- Shoulder bumpers — Quick Settings / Notifications ----------------------
# ZL (mapped to l1 on the handheld) opens Notifications from the left.
# ZR (mapped to r1) opens Quick Settings from the right.
# Change these to "workspace_prev"/"workspace_next" if you prefer cycling.
l1 = "open_notifications"
r1 = "open_quick_settings"

# --- Long-press / chord system actions --------------------------------------
select_long           = "lock"
l2_r2_brightness_up   = "brightness_up"
l2_r2_brightness_down = "brightness_down"
l2_r2_volume_up       = "volume_up"
l2_r2_volume_down     = "volume_down"
l2_r2_wifi            = "wifi_toggle"
l2_r2_bt              = "bluetooth_toggle"
