  min    = 0
  max    = 100
  step   = 5

  [[section.rows]]
  key     = "audio.output"
  label   = "Output Device"
  icon    = "🎧"
  desc    = "Where audio is routed"
  widget  = "select"
  options = ["Built-in Speaker", "Headphones", "Bluetooth", "HDMI"]

  [[section.rows]]
  key    = "audio.sound_fx"
  label  = "UI Sound Effects"
  icon   = "🎵"
  desc   = "Play navigation and confirmation sounds"
  widget = "toggle"

