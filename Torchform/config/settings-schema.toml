# =============================================================================
# settings-schema.toml — Torchform Settings display schema
#
# This file defines the sections and rows shown in the Settings app.
# Copy to ~/.config/torchform/settings-schema.toml to override.
#
# Widget types:
#   slider   — requires min, max, step
#   toggle   — boolean on/off
#   select   — requires options = [...]
#   text     — read-only display
#   action   — press A to activate (fires apply_activation)
#
# Each row's `key` is the dotted path used by read_value/apply_activation/
# apply_adjustment in settings.rs.  Keys not handled there are no-ops.
# =============================================================================

# ---------------------------------------------------------------------------
# DISPLAY
# ---------------------------------------------------------------------------
[[section]]
id    = "display"
title = "DISPLAY"

  [[section.rows]]
  key    = "display.brightness"
  label  = "Brightness"
  icon   = "🔆"
  desc   = "Screen backlight level (0–100 %)"
  widget = "slider"
  min    = 0
  max    = 100
  step   = 5

  [[section.rows]]
  key    = "display.night_mode"
  label  = "Night Mode"
  icon   = "🌙"
  desc   = "Reduce blue light for low-light use"
  widget = "toggle"

  [[section.rows]]
  key     = "display.refresh_rate"
  label   = "Refresh Rate"
  icon    = "⚡"
  desc    = "Upper display refresh rate"
  widget  = "select"
  options = ["60 Hz", "90 Hz", "120 Hz"]

  [[section.rows]]
  key     = "display.orientation"
  label   = "Orientation"
  icon    = "↔"
  desc    = "Display rotation"
  widget  = "select"
  options = ["Landscape", "Portrait", "Landscape (flipped)"]

# ---------------------------------------------------------------------------
# AUDIO
# ---------------------------------------------------------------------------
