# sway.conf — Torchform demo compositor config
# Minimal Sway setup for QuickShell demo + wayvnc streaming.

# ── Outputs ──────────────────────────────────────────────────────────────────
# Headless mode: WLR_BACKENDS=headless creates HEADLESS-1 automatically.
# Resolution is set at runtime by start.sh via wlr-randr.
# For physical displays, add output blocks here after verifying connector names
# with: swaymsg -t get_outputs

# ── Appearance ────────────────────────────────────────────────────────────────
# No gaps, no bars — QuickShell owns the entire surface.
gaps inner 0
gaps outer 0
default_border none
hide_edge_borders both

# Transparent wallpaper (QuickShell bg covers it anyway)
output * bg #0d0f14 solid_color

# ── Input ─────────────────────────────────────────────────────────────────────
input type:keyboard {
    xkb_layout  us
    repeat_delay 300
    repeat_rate  30
}

# ── Startup ───────────────────────────────────────────────────────────────────
# dbus-launch needed for some Qt6 internals
exec dbus-launch --sh-syntax --exit-with-session true

# QuickShell demo (started by start.sh after sway is up)
# exec quickshell -c /path/to/shell.qml

# wayvnc on upper display (VNC port 5900)
# exec wayvnc --output=HDMI-A-1 0.0.0.0 5900

# ── Key bindings (fallback escape hatch) ──────────────────────────────────────
# Sway+Q  : kill focused window (emergency exit)
# Sway+Esc: exit sway
set $mod Mod4
bindsym $mod+q      kill
bindsym $mod+Escape exec swaymsg exit

# ── No bar ────────────────────────────────────────────────────────────────────
bar {
    mode invisible
}
