[workspace]
resolver = "2"
members = [
    "crates/torchform-compositor",
    "crates/torchform-shell",
    "crates/torchform-inputd",
    "crates/torchform-run",
    "crates/torchform-actions",
    "crates/torchform-config",
    "crates/torchform-settings",
    "crates/torchform-files",
    "crates/torchform-terminal",
    "crates/minerva-emulator",
]

# ---------------------------------------------------------------------------
# Shared workspace dependencies
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Async runtime
tokio          = { version = "1",   features = ["full"] }

# Serialisation
serde          = { version = "1",   features = ["derive"] }
serde_json     = { version = "1" }
toml           = { version = "0.8" }

# Error handling
anyhow         = { version = "1" }
thiserror      = { version = "1" }

# Logging / tracing
tracing        = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Wayland compositor library
smithay        = { version = "0.5", default-features = false, features = [
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_winit",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
] }

# DRM/KMS for headless/direct rendering
drm            = { version = "0.14" }

# Libseat — seat management without logind dependency
libseat        = { version = "0.2" }

# Input — libinput bindings
input          = { version = "0.9", features = ["libinput_1_19"] }

# udev — device enumeration for DRM/input backends
udev           = { version = "0.8" }

# calloop — event loop used internally by Smithay
calloop        = { version = "0.13", features = ["signals"] }

# Wayland protocol types
wayland-server = { version = "0.31" }

# Slint UI toolkit
slint          = { version = "1",   features = ["backend-winit"] }
slint-build    = { version = "1" }

# Linux uinput (virtual input device)
uinput         = { version = "0.1.3" }

# Audio feedback
rodio          = { version = "0.22", default-features = false, features = ["playback", "vorbis"] }

# SPI (Cirque trackpad)
spidev         = { version = "0.6" }

# Gamepad / HID controller input (cross-platform, works in Docker via evdev)
gilrs          = { version = "0.10" }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
