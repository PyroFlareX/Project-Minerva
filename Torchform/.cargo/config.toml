# ---------------------------------------------------------------------------
# Torchform — Cargo build configuration
# ---------------------------------------------------------------------------
# Requires: mold (linker), clang (frontend)
#   sudo apt install mold clang

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
